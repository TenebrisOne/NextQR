<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A0A0B" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="La página que buscas no existe. Regresa a NexbarQR para crear códigos QR y de barras gratis." />
  <title>Página no encontrada | NexbarQR</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --noir: #0A0A0B;
      --marfil: #EDEBDD;
      --cherry: #D01B23;
      --cherry-bright: #FF2D4D;
      --grafito-claro: #6E6E73;
      --line: rgba(237, 235, 221, .10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--noir);
      color: var(--marfil);
      font-family: "Inter", system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 2rem;
      background-image:
        radial-gradient(700px 360px at 50% -8%, rgba(208, 27, 35, .12), transparent 60%),
        radial-gradient(rgba(237, 235, 221, .07) 1px, transparent 1.4px);
      background-size: auto, 26px 26px;
      background-attachment: fixed;
    }
    .card {
      text-align: center;
      max-width: 460px;
      border: 1px solid var(--line);
      background: rgba(30, 32, 36, .55);
      backdrop-filter: blur(6px);
      border-radius: 14px;
      padding: 3rem 2.2rem;
      position: relative;
    }
    .card::before, .card::after {
      content: ""; position: absolute; width: 18px; height: 18px;
      border: 2px solid var(--cherry);
    }
    .card::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
    .card::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
    .kicker {
      font-family: "JetBrains Mono", monospace;
      font-size: .72rem; letter-spacing: .12em;
      color: var(--cherry); margin-bottom: .9rem;
    }
    .code {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(4rem, 14vw, 6rem);
      font-weight: 700; line-height: 1; letter-spacing: -.03em;
      background: linear-gradient(135deg, var(--cherry), var(--cherry-bright));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.2rem; font-weight: 600;
      color: var(--marfil); margin: 1rem 0 .5rem;
    }
    p { color: var(--grafito-claro); font-size: .95rem; line-height: 1.6; margin-bottom: 1.6rem; }
    .btn {
      display: inline-block;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600; font-size: .95rem;
      color: var(--marfil); text-decoration: none;
      background: var(--cherry);
      padding: .8rem 1.6rem; border-radius: 9px;
      transition: background .15s, transform .15s, box-shadow .15s;
    }
    .btn:hover { background: var(--cherry-bright); box-shadow: 0 10px 26px rgba(208, 27, 35, .35); transform: translateY(-1px); }
    .btn:focus-visible { outline: 3px solid rgba(217, 4, 41, .4); outline-offset: 2px; }
    .skip-link { position: fixed; top: .75rem; left: .75rem; z-index: 10; padding: .7rem 1rem; background: var(--marfil); color: var(--noir); border-radius: 9px; font-weight: 700; transform: translateY(-160%); }
    .skip-link:focus { transform: translateY(0); outline: 3px solid var(--cherry); outline-offset: 2px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <main class="card" id="main">
    <div class="kicker">// error_404</div>
    <div class="code">404</div>
    <h1>Esta página no existe</h1>
    <p>La ruta que buscas no forma parte de NexbarQR. Vuelve al generador para crear tu código QR o de barras.</p>
    <a class="btn" href="/">← Volver a NexbarQR</a>
  </main>
</body>
</html>
